# Recipe Format — Design Philosophy
# Recipes in this format are split across three pages: You Will Need, Prep, and Cook. Content and presentation are fully separated — recipes are stored as YAML and rendered to PDF by a script that reads a style configuration file.
# You Will Need lists ingredients at total quantities (if an ingredient is used in multiple steps, the shopping total appears here, not the per-step amounts) and optionally lists equipment.
# Prep is an ordered sequence of actions, read top to bottom, that walks the cook through everything that needs to happen before cooking begins. It is not a static inventory. Steps may be imperative ("Into a small ramekin, measure the cumin seed") or non-imperative bare ingredient placements ("Olive oil (3 Tbsp)"). A vessel label appears as a header only when multiple prepped ingredients can be placed in the same container. Listing an ingredient under a vessel header means placing that ingredient into that vessel — no "into the bowl, add..." phrasing is required for each item. Single discrete actions (dicing a vegetable, measuring a solo ingredient) are plain steps with no vessel label. Preheating the oven is never a setup action and never appears in this section.
# Cook is a sequence of numbered steps grouped under bold phase headers. Preheating the oven is never bundled into another phase — if the oven needs to preheat, it appears as its own phase, "Preheat oven," which is optional and always appears first when used. Any time the cook must wait for a specific duration, the action that follows the wait goes in a new step.
# Ingredient ordering within a vessel follows this sequence: herbs, vegetables and fruits, aromatics, other animal products, meat/protein, cans/bottles/pantry (salt, pepper, and other spices are pantry items). Within each category, order by quantity descending.
# Split ingredients — if an ingredient is used in multiple steps at different amounts, list the total in You Will Need and list it separately in each prep or cook step where it appears.

# Recipe Schema — every supported field with comments
# All fields marked (optional) can be omitted

title: Recipe Title
subtitle: Serves 4 · ~45 min · Serve with crusty bread, garnish with parsley  # (optional)

# ─── PAGE 1: INGREDIENTS & EQUIPMENT ─────────────────────────────────────────

ingredients:
  - Item name, quantity         # plain string, one item per line
  - Item name, quantity
  # Shopping list total quantities — if an ingredient is used in multiple
  # steps, list the TOTAL amount here, not the per-step amount.

equipment:                      # (optional) — omit if nothing special needed
  - Two 8x8-inch baking pans
  - Stand mixer

# ─── PAGE 2: PREP ────────────────────────────────────────────────────
# The prep page is an ORDERED SEQUENCE OF ACTIONS, top to bottom.
# Vessel labels appear only when you are building something up across
# multiple steps in one container. Single discrete actions are plain steps.
#
# Style rules:
#   - Steps may be imperative ("Dice the tomatoes", "Measure 2 cups stock")
#     or non-imperative bare ingredient placements ("Olive oil (3 Tbsp)").
#   - When things can share a vessel (don't need to be kept separate until
#     a specific step) the steps are grouped under that vessel's header.
#     Listing an ingredient under a vessel means placing it into that vessel.
#   - Within a vessel, ingredients follow the ordering rule above: herbs,
#     vegetables and fruits, aromatics, other animal products, meat/protein,
#     cans/bottles/pantry (salt/pepper/spices count as pantry). Order by
#     quantity descending within each category.
#   - Slicing/dicing/prep of an ingredient happens here as its own action
#     step, not as a parenthetical on an ingredient name.
#   - Preheating the oven ALWAYS belongs in the Cook section, never here.

prep:
  - step: Wash and dry all produce.       # top-level action, no vessel

  - vessel: Large Mixing Bowl
    steps:
      - Zest of both lemons
      - Juice of one lemon.
      - Garlic paste
      - Olive oil (3 Tbsp)
      - Salt (1 tsp)
      - Pepper
      - Whisk to combine.
      - Add the chicken and toss to coat. Marinate at least 20 minutes.

  - step: Slice the onion and pepper into bite-size pieces.   # back to top-level
  - step: Dice the tomatoes.
  - step: Measure 2 cups stock.

# ─── PAGE 3: COOK ─────────────────────────────────────────────────────────────
# Style rules:
#   - Preheating the oven is never bundled into another phase. If the oven
#     needs to preheat, it appears as its own optional phase, "Preheat oven,"
#     which always appears first in this section when used.
#   - Steps are numbered continuously across all phases.
#   - Any time the cook must wait for a specific duration, the next action
#     goes in a new step.

cook:
  - phase: Preheat oven                    # optional; always first if present
    steps:
      - Preheat to 375°F (190°C).

  - phase: Phase Name                 # bold header
    steps:
      - First step text.
      - Cook undisturbed for 5 minutes.   # time reference → its own step
      - Next action after waiting.

  - phase: Another Phase
    steps:
      - Step one.
      - Step two.
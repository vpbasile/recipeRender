title: Chicken Peanut Stew
subtitle: Serves 2 · Great over rice or hearty whole-grain bread · Top with fresh microgreens

# ─── PAGE 1: INGREDIENTS & EQUIPMENT ─────────────────────────────────────────

ingredients:
  - Red bell pepper - 1
  - Onion - 1
  - Plum tomatoes - 3
  - Baby spinach - 1/2 lb
  - Lime - 2
  - Ginger paste
  - Garlic paste, plus more to taste
  - Neutral oil - 2 Tbsp
  - Sesame oil - 1 tsp
  - Chili powder - 1/2 tsp, plus more to taste
  - Brown sugar or honey - 2 tsp, plus more to taste
  - Peanut butter powder - 1/4 cup
  - Chicken thighs - 2
  - Broth or stock - 2 cups
  - Salt - 1 tsp, plus more to taste
  - Black pepper, to taste

# ─── PAGE 2: PREP ─────────────────────────────────────────────────────────────

prep:
  - step: Wash and dry all produce.

  - vessel: Chicken Marinade
    steps:
      - Zest both limes into the vessel, then cut the limes in half.
      - Juice of half a lime
      - Ginger paste
      - Garlic paste
      - Neutral oil (2 Tbsp)
      - Brown sugar or honey (2 tsp)
      - Sesame oil (1 tsp)
      - Salt (1 tsp)
      - Chili powder (1/2 tsp)
      - Black pepper, to taste
      - Whisk to combine.
      - Slice the chicken into bite-size pieces, add to the marinade, and toss to coat. Marinate at least 15 minutes.

  - step: Slice the onion and pepper into bite-size pieces.
  - step: Dice the tomatoes.
  - step: Measure 2 cups stock.
  - step: Measure 1/4 cup peanut butter powder.
  - step: Measure 1/2 lb spinach.

# ─── PAGE 3: COOK ─────────────────────────────────────────────────────────────

cook:
  - phase: Brown the Chicken
    steps:
      - Heat a pan over medium-high heat and add the marinated chicken.
      - Cook undisturbed for 2 minutes.
      - Turn the chicken and cook for another 2 minutes to brown.
      - Stir, then cook for 5 minutes, stirring occasionally.
      - Set the chicken aside.

  - phase: Cook the Aromatics
    steps:
      - Salt the onion and pepper and cook until soft and translucent, about 7 minutes.
      - If using more garlic, add it now and cook until fragrant.

  - phase: Simmer the Stew
    steps:
      - Add the broth, peanut butter powder, chicken, and tomatoes.
      - Bring to a boil, then reduce to a simmer and cook uncovered for 20-25 minutes.
      - Taste and adjust seasonings (salt, pepper, chili powder, brown sugar) as needed.

  - phase: Finish and Serve
    steps:
      - Stir in the spinach and turn off the heat as soon as it wilts.
      - Serve with the remaining lime juice.
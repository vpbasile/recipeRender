title: Chicken Peanut Stew
subtitle: Makes 2 servings · Great over rice · Finish with fresh lime juice

ingredients:
  - Baby spinach, 1/2 lb
  - Plum tomatoes, 3
  - Red bell pepper, 1
  - Onion, 1
  - Limes, 2
  - Ginger paste
  - Garlic paste
  - Neutral oil, 2 Tbsp
  - Sesame oil, 1 tsp
  - Chili powder
  - Brown sugar or honey, 2 tsp
  - Salt
  - Black pepper
  - Peanut butter powder, 4 Tbsp
  - Chicken thighs, 2
  - Broth or stock, 2 cups

prep:
  - step: Wash and dry all produce.
  - step: Zest both limes into the marinating dish.
  - vessel: Marinating Dish
    steps:
      - Into the dish, juice half a lime (reserve 1.5 limes for finishing).
      - Into the dish, measure the neutral oil (2 Tbsp), sesame oil (1 tsp), ginger paste, garlic paste, brown sugar or honey (2 tsp), salt (1 tsp), black pepper, and chili powder (1/2 tsp). Stir to combine.
      - Slice the chicken thighs into bite-size pieces and add them to the dish. Toss to coat.
      - Marinate at least 15 minutes.
  - step: Slice the onion and pepper into bite-size pieces.
  - step: Dice the tomatoes.
  - step: Measure 2 cups broth or stock.
  - step: Measure 4 Tbsp peanut butter powder.
  - step: Measure 1/2 lb baby spinach.

cook:
  - phase: Prepare
    steps:
      - Preheat a pan over medium-high heat.

  - phase: Cook the Chicken
    steps:
      - Add the chicken with its marinade to the hot pan. Cook undisturbed for 2 minutes.
      - Turn the chicken over and cook undisturbed for another 2 minutes to brown.
      - Stir and cook for another 5 minutes, stirring occasionally.
      - Set the chicken aside.

  - phase: Build the Stew
    steps:
      - In the same pan, cook the onions and peppers over medium heat until soft and translucent, up to 7 minutes.
      - Add more garlic now if desired, and cook until fragrant.
      - Add the broth, peanut butter powder, chicken, and tomatoes. Stir to combine.
      - Bring to a boil, then reduce to a simmer. Cook uncovered for 20-25 minutes.
      - Taste and adjust seasonings — salt, pepper, chili powder, brown sugar — as needed.

  - phase: Finish
    steps:
      - Stir in the spinach and turn off the heat as soon as it wilts.
      - Squeeze in the juice of the remaining limes. Serve immediately.

title: Chana Masala
subtitle: Makes 2-4 servings · Serve over rice with a dollop of yogurt · Garnish with fresh cilantro

ingredients:
  - Onion (red or white), 1 medium (~1.5 cups)
  - Cilantro, 3 Tbsp (optional)
  - Cumin seed, 1 tsp
  - Turmeric, 1/2 tsp
  - Ginger powder, 1 tsp
  - Garlic powder, 1 tsp
  - Coriander powder, 1 tsp
  - Cumin powder, 1 tsp
  - Cayenne pepper, 1/4 tsp
  - Garam masala, 1 tsp
  - Olive oil or ghee, 2 Tbsp
  - Tomatoes, 14.5 oz can
  - Chickpeas, 15 oz can
  - Salt
  - Water
  - Rice, for serving
  - Yogurt, for serving

prep:
  - step: Finely chop the onion.
  - step: Into a small bowl, measure the cumin seed (1 tsp).
  - step: Into a small bowl, measure the turmeric (1/2 tsp).
  - step: Into a small bowl, measure the ginger powder (1 tsp) and garlic powder (1 tsp). Set aside together.
  - step: Into a small bowl, measure the coriander powder (1 tsp).
  - step: Into a small bowl, measure the cumin powder (1 tsp).
  - step: Into a small bowl, measure the cayenne pepper (1/4 tsp).
  - step: Into a small bowl, measure the garam masala (1 tsp).
  - step: Open the tomato can. Open the chickpea can, reserving 1 Tbsp of the liquid, then drain and rinse the chickpeas.
  - step: If using cilantro, roughly chop 3 Tbsp and set aside.

cook:
  - phase: Prepare
    steps:
      - Get your rice started according to package directions.

  - phase: Build the Curry
    steps:
      - Toast the cumin seeds in a dry skillet over medium heat until they start popping.
      - Add the olive oil or ghee and let it get hot.
      - Add the onion and turmeric. Cook for 3-4 minutes.
      - Add the ginger and garlic powder and stir. Add the coriander powder and stir to release the aromas. Then add the cumin powder and stir.
      - Add the tomatoes and cayenne. Cook for 6-8 minutes until the tomatoes are soft and the oil separates.
      - Add the chickpeas, reserved chickpea liquid, salt, and enough water to just cover the chickpeas.
      - Cover the pan and cook for 10-12 minutes until the chickpeas are soft.
      - Uncover and stir in the garam masala. Let the sauce thicken to your liking.

  - phase: Serve
    steps:
      - Serve over rice with yogurt.
      - If using fresh cilantro, add it now.

title: Brownies Two Ways
subtitle: Makes two 8x8-inch pans — one classic, one with mix-ins

ingredients:
  - All-purpose flour, 1 1/2 cups (180g)
  - Dutch-process cocoa, 1 1/4 cups (106g)
  - Granulated sugar, 2 1/4 cups (447g)
  - Salted butter, 2 sticks (226g)
  - Large eggs, 5
  - Vanilla extract, 1 Tbsp (14g)
  - Water, 1/2 cup (113g)
  - Baking powder, 1 tsp
  - Salt, 1/2 tsp
  - Chocolate chips (optional), up to 2 cups combined with nuts
  - Chopped walnuts or pecans (optional), up to 2 cups combined with chips

equipment:
  - Two 8x8-inch baking pans
  - Parchment paper
  - Hand or stand mixer

prep:
  - step: Into a small bowl, whisk together the cocoa, baking powder, and salt.
  - step: Into a medium bowl, combine the flour and any optional mix-ins.
  - step: Into a large bowl, measure the sugar.

cook:
  - phase: Prepare
    steps:
      - If using nuts, toast them now and set aside to cool.
      - Preheat oven to 350°F (175°C). Line two 8x8-inch pans with parchment and grease lightly.

  - phase: Make the Batter
    steps:
      - Melt the butter and let it cool slightly.
      - Add the melted butter to the large bowl with the sugar. Stir until smooth and glossy.
      - Stir the cocoa mixture into the sugar-butter mixture along with the vanilla extract.
      - Beat in the eggs one at a time, mixing well after each addition.
      - Add the water and scrape the sides of the bowl. Stir until smooth and fully combined.
      - Add the flour and stir until just combined.

  - phase: Divide and Add Mix-ins
    steps:
      - Pour half the batter into one pan (approximately 950-975g).
      - Toss the optional mix-ins in a spoonful of flour. Stir them into the remaining batter.
      - Pour that batter into the other pan.
      - Smooth the tops of both pans.

  - phase: Bake
    steps:
      - Bake both pans for 25-30 minutes, rotating halfway through.
      - Check doneness — a toothpick inserted in the center should come out with moist crumbs.

  - phase: Cool
    steps:
      - Cool in the pans for 15 minutes.
      - Lift out using the parchment and cool completely on a rack.
      - Glaze or frost if desired. Store airtight, or freeze one pan for later.

title: Cocoa Brownies
subtitle: One 9" x 13" pan · Bake 28–30 min

# ─── PAGE 1: INGREDIENTS & EQUIPMENT ─────────────────────────────────────────

ingredients:
  - Granulated sugar
  - Dutch-process cocoa
  - Baking powder
  - Salt, 1/2 tsp (omit if using salted butter)
  - All-purpose flour
  - (optional) Mix-ins like chopped walnuts or pecans and/or chocolate chips, 2 cups total
  - Large eggs, 5
  - Water
  - Salted butter, 2 sticks
  - Vanilla extract

equipment:
  - 9" x 13" pan
  - Electric mixer or whisk
  - Cooling rack

# ─── PAGE 2: PREP ────────────────────────────────────────────────────────────
# (omitted — nothing here needs to happen ahead of or separate from the
# active cook flow; the batter comes together while the oven preheats,
# so that work lives on the Cook page instead)

# ─── PAGE 3: COOK ─────────────────────────────────────────────────────────────

cook:
  - phase: Preheat oven
    steps:
      - Preheat to 350°F (177°C).

  - phase: Measure everything
    steps:
      - Grease the pan.
      - vessel: "In a large bowl, measure:"
        steps:
          - Granulated sugar - 2 1/4 cups (447g)
      - vessel: "In a small bowl, measure: "
        steps:
          - Dutch-process cocoa - 1 1/4 cups (106g)
          - Baking powder - 1 teaspoon
          - (if using unsalted butter) Salt - 1/2 teaspoon
      - vessel: "In a medium bowl, measure:"
        steps:
          - All-purpose flour - 1 1/2 cups (180g)
          - Mixins - 2 cups total
          - Toss the mix-ins in the flour to coat
      - Measure 1/2 cup water

  - phase: Make the Batter
      - Melt the two sticks of butter.
      - Combine the melted butter and sugar in the large bowl, stirring until smooth.
      - Stir in the cocoa mixture and 1 TBPSP vanilla extract.
      - Beat in the eggs one at a time.
      - Scrape the bowl, then stir in the water until smooth.
      - Stir theflour mixture into the batter until thoroughly combined.
      - Spoon the batter into the prepared pan.

  - phase: Bake
    steps:
      - Bake for 28 to 30 minutes, until the top is dry and the edges have started to pull away from the sides, or a toothpick inserted into the center comes out clean.

  - phase: Cool
    steps:
      - Remove the brownies from the oven and cool them on a rack before cutting and serving. Let the brownies cool fully before cutting — warm, they're closer to chocolate cake; as they settle while cooling they become the dense, fudgy cake-type brownie.
      - Glaze or frost, if desired.

# style.yaml — all visual settings for recipe PDFs
# Edit this file to restyle without touching recipes or render.py

page:
  size: letter          # letter or A4
  margin_top: 0.75      # inches
  margin_bottom: 0.75
  margin_left: 0.85
  margin_right: 0.85

colors:
  primary: "#1a1a1a"        # main text
  secondary: "#4a4a4a"      # subtitle, secondary text
  accent: "#8B3A2A"         # phase headers, rule lines
  light: "#f5f0eb"          # alternating row / background tint
  muted: "#888888"          # vessel labels, step numbers

fonts:
  # reportlab built-ins: Helvetica, Times-Roman, Courier (and Bold/Italic variants)
  title: "Times-Roman"
  subtitle: "Times-Roman"
  heading: "Helvetica-Bold"
  body: "Helvetica"
  label: "Helvetica-Bold"

sizes:
  title: 28
  subtitle: 13
  page_heading: 18        # "Ingredients & Equipment", "Prep", "Cook"
  phase_heading: 13
  vessel_label: 11
  body: 10.5
  small: 9

spacing:
  after_title: 4          # points
  after_subtitle: 18
  after_page_heading: 14
  after_phase: 6
  after_vessel: 14
  between_steps: 5
  between_ingredients: 3
  rule_thickness: 0.75    # points

web:
  theme_hue: 260
  light:
    bg_top: "#f9f7fd"
    bg_bottom: "#e9e5f0"
    surface: "rgba(255, 255, 255, 0.92)"
    surface_strong: "rgba(241, 239, 246, 0.55)"
    border_soft: "rgba(75, 42, 141, 0.12)"
    border_strong: "rgba(75, 42, 141, 0.16)"
    shadow: "rgba(39, 31, 55, 0.12)"
    card_alt: "white"
    hero_glow: "rgba(75, 42, 141, 0.18)"
    primary: "#19171c"
    secondary: "#484351"
    accent: "#4b2a8d"
    light: "#eeebf4"
    muted: "#837a94"
  dark:
    bg_top: "#171320"
    bg_bottom: "#0c0910"
    surface: "rgba(23, 19, 32, 0.94)"
    surface_strong: "rgba(38, 31, 50, 0.84)"
    border_soft: "rgba(177, 138, 255, 0.18)"
    border_strong: "rgba(177, 138, 255, 0.24)"
    shadow: "rgba(0, 0, 0, 0.35)"
    card_alt: "rgba(17, 14, 22, 0.95)"
    hero_glow: "rgba(177, 138, 255, 0.18)"
    primary: "#ebe8f3"
    secondary: "#bfb4d5"
    accent: "#b18aff"
    light: "rgba(177, 138, 255, 0.1)"
    muted: "#977fc7"

decorations:
  show_rule_under_title: true
  show_rule_under_page_heading: true
  alternate_ingredient_rows: true
  step_bullet: "·"        # character used before prep steps
